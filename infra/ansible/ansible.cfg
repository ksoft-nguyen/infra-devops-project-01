[defaults]
host_key_checking = False
timeout = 60
forks = 1
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPersist=no -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes -o StrictHostKeyChecking=no
retries = 5
pipelining = True
