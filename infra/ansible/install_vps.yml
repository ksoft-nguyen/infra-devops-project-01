---
- name: Setup VPS with Docker, Security, Source Code, Proxy, CI/CD, and Monitoring
  hosts: ec2
  become: true
  gather_facts: false

  vars:
    docker_conflicting_packages:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    docker_engine_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_apt_keyring: /etc/apt/keyrings/docker.asc
    project_repo_url: https://github.com/ksoft-nguyen/infra-devops-project-01.git
    project_repo_version: HEAD
    project_source_dir: /home/ubuntu/infra-devops-project-01
    app_stack_dir: "{{ project_source_dir }}/resource"
    app_env_file: "{{ app_stack_dir }}/.env"
    app_make_project: mern-todo
    app_compose_project: "{{ app_make_project }}-prod"
    app_container_names:
      - mern-todo-mongodb
      - mern-todo-backend-prod
      - mern-todo-frontend-prod
    app_mongo_root_username: admin
    app_mongo_root_password: password123
    app_mongo_database: mern_todo
    app_mongo_express_username: admin
    app_mongo_express_password: admin
    app_external_backend_port: "8111"
    app_internal_backend_port: "8111"
    app_jwt_secret: BI_MAT
    app_gmail_username: ""
    app_gmail_password: ""
    app_external_frontend_port: "3111"
    app_react_app_api_url: "https://api-final-project.nguyentrungkien.net/api"
    nginx_proxy_manager_stack_dir: /opt/nginx-proxy-manager
    nginx_proxy_manager_compose_file: docker-compose.nginx-proxy-manager.yml
    nginx_proxy_manager_container_names:
      - nginx-proxy-manager
    ci_cd_stack_dir: /opt/ci-cd
    ci_cd_compose_file: docker-compose.ci-cd.yml
    ci_cd_container_names:
      - jenkins
    ci_cd_jenkins_url: "http://{{ ansible_host | default(inventory_hostname) }}:8080/"
    ci_cd_jenkins_admin_user: "{{ lookup('env', 'JENKINS_ADMIN_ID') | default('admin', true) }}"
    ci_cd_jenkins_admin_password: "{{ lookup('env', 'JENKINS_ADMIN_PASSWORD') | default('admin123', true) }}"
    ci_cd_deploy_branch: main
    ci_cd_jenkins_job_name: deploy-mern-todo
    ci_cd_jenkinsfile_path: infra/ansible/files/ci-cd/jobs/deploy-mern-todo/Jenkinsfile
    monitoring_stack_dir: /opt/monitoring
    monitoring_compose_file: docker-compose.monitoring.yml
    monitoring_container_names:
      - grafana
      - prometheus
      - host-node-exporter
      - host-blackbox
      - mongodb-exporter
      - alertmanager
    monitoring_app_network_name: "{{ app_compose_project }}_mern-network"
    monitoring_grafana_admin_user: "{{ lookup('env', 'GRAFANA_ADMIN_USER') | default('admin', true) }}"
    monitoring_grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('admin123', true) }}"
    monitoring_alert_email_address: "{{ lookup('env', 'ALERTMANAGER_EMAIL') | default('kennynguyen110702@gmail.com', true) }}"
    monitoring_alert_email_from: "{{ lookup('env', 'ALERTMANAGER_EMAIL_FROM') | default(monitoring_alert_email_address, true) }}"
    monitoring_alert_email_to: "{{ lookup('env', 'ALERTMANAGER_EMAIL_TO') | default(monitoring_alert_email_address, true) }}"
    monitoring_alert_smtp_smarthost: "{{ lookup('env', 'ALERTMANAGER_SMTP_SMARTHOST') | default('smtp.gmail.com:587', true) }}"
    monitoring_alert_smtp_auth_username: "{{ lookup('env', 'ALERTMANAGER_SMTP_USERNAME') | default(monitoring_alert_email_address, true) }}"
    monitoring_alert_smtp_auth_password_file: "{{ lookup('file', playbook_dir ~ '/.alertmanager_smtp_password', errors='ignore') | default('', true) }}"
    monitoring_alert_smtp_auth_password: "{{ lookup('env', 'ALERTMANAGER_SMTP_PASSWORD') | default(monitoring_alert_smtp_auth_password_file, true) | regex_replace('\\s+', '') }}"

  pre_tasks:
    - name: Wait for SSH to become available
      wait_for_connection:
        timeout: 300
        connect_timeout: 30
        sleep: 5

    - name: Gather facts
      setup:

  tasks:
    - name: Configure Docker
      import_tasks: tasks/docker.yml

    - name: Configure swap
      import_tasks: tasks/swap.yml

    - name: Configure firewall
      import_tasks: tasks/firewall.yml

    - name: Configure Fail2Ban
      import_tasks: tasks/fail2ban.yml

    - name: Harden SSH
      import_tasks: tasks/ssh_hardening.yml

    - name: Clone project source code
      import_tasks: tasks/source_code.yml

    - name: Deploy MERN application stack
      import_tasks: tasks/app.yml

    - name: Deploy Nginx Proxy Manager stack
      import_tasks: tasks/nginx_proxy_manager.yml

    - name: Deploy CI/CD stack
      import_tasks: tasks/ci_cd.yml

    - name: Deploy monitoring stack
      import_tasks: tasks/monitoring.yml

    - name: Verify installation
      import_tasks: tasks/verify.yml
