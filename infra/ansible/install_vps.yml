---
- name: Setup VPS with Docker and Security
  hosts: ec2
  become: true

  vars:
    docker_conflicting_packages:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    docker_engine_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_apt_keyring: /etc/apt/keyrings/docker.asc

  tasks:
    # ---- Docker ----
    - name: Find Docker apt source files
      command: grep -Rsl download.docker.com/linux/ubuntu /etc/apt/sources.list.d
      register: docker_apt_source_files
      changed_when: false
      failed_when: false

    - name: Remove Docker apt source files
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ docker_apt_source_files.stdout_lines }}"
      loop_control:
        label: "{{ item }}"

    - name: Check main apt sources list
      stat:
        path: /etc/apt/sources.list
      register: apt_sources_list

    - name: Remove Docker repo entries from main apt sources list
      lineinfile:
        path: /etc/apt/sources.list
        regexp: "download\\.docker\\.com/linux/ubuntu"
        state: absent
      when: apt_sources_list.stat.exists

    - name: Remove old Docker apt keyrings
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/keyrings/docker.gpg
        - /etc/apt/keyrings/docker.asc

    - name: Remove Ubuntu Docker packages that conflict with Docker CE
      apt:
        name: "{{ docker_conflicting_packages }}"
        state: absent
        purge: yes
        autoremove: yes
        update_cache: yes

    - name: Install Docker apt dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Create Docker apt keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker apt GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: "{{ docker_apt_keyring }}"
        mode: "0644"

    - name: Set Docker apt architecture
      set_fact:
        docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_architecture, ansible_architecture) }}"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: yes

    - name: Install Docker Engine from Docker apt repository
      apt:
        name: "{{ docker_engine_packages }}"
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ---- Swap (for t2.micro 1GB RAM) ----
    - name: Create swap file
      shell: |
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    # ---- Security: UFW Firewall ----
    - name: Install UFW
      apt:
        name: ufw
        state: present

    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    # ---- Security: Fail2Ban ----
    - name: Install Fail2Ban
      apt:
        name: fail2ban
        state: present

    - name: Configure Fail2Ban for SSH
      copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [sshd]
          enabled = true
          port = 22
          filter = sshd
          logpath = /var/log/auth.log
          maxretry = 3
          bantime = 3600
          findtime = 600

    - name: Start and enable Fail2Ban
      systemd:
        name: fail2ban
        enabled: yes
        state: restarted

    # ---- Security: SSH Hardening ----
    - name: Disable root login via SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin no"

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"

    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted

    # ---- Verify ----
    - name: Check Docker version
      command: docker --version
      register: docker_ver
      changed_when: false

    - name: Check Docker Compose version
      command: docker compose version
      register: compose_ver
      changed_when: false

    - name: Show versions
      debug:
        msg:
          - "{{ docker_ver.stdout }}"
          - "{{ compose_ver.stdout }}"
