services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - ci_cd_network

volumes:
  jenkins_home:
    driver: local

networks:
  ci_cd_network:
    name: ci_cd_network
    driver: bridge
