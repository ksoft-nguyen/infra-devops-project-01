---
- name: Create monitoring stack directory
  file:
    path: "{{ monitoring_stack_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy monitoring stack files
  copy:
    src: "{{ playbook_dir }}/files/monitoring/"
    dest: "{{ monitoring_stack_dir }}/"
    owner: ubuntu
    group: ubuntu
    mode: preserve
    directory_mode: "0755"
  register: monitoring_stack_files

- name: Create monitoring environment file
  template:
    src: monitoring.env.j2
    dest: "{{ monitoring_stack_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  register: monitoring_env_file_result
  no_log: true

- name: Warn when Alertmanager Gmail app password is not provided
  debug:
    msg: "ALERTMANAGER_SMTP_PASSWORD is not set. Monitoring will deploy, but Alertmanager email notifications will stay disabled."
  when: monitoring_alert_smtp_auth_password | length == 0

- name: Create Alertmanager email configuration
  template:
    src: alertmanager.yml.j2
    dest: "{{ monitoring_stack_dir }}/alertmanager/alertmanager.yml"
    owner: "65534"
    group: "65534"
    mode: "0600"
  register: monitoring_alertmanager_config
  no_log: true
  when: monitoring_alert_smtp_auth_password | length > 0

- name: Check MERN application Docker network exists
  command:
    argv:
      - docker
      - network
      - inspect
      - "{{ monitoring_app_network_name }}"
  register: monitoring_app_network_check
  changed_when: false

- name: Inspect existing monitoring containers
  command:
    argv:
      - docker
      - inspect
      - "--format"
      - "{{ '{{ json .Config.Labels }}' }}"
      - "{{ item }}"
  loop: "{{ monitoring_container_names }}"
  register: existing_monitoring_containers
  changed_when: false
  failed_when: false

- name: Remove legacy monitoring containers
  command:
    argv:
      - docker
      - rm
      - "--force"
      - "{{ item.item }}"
  loop: "{{ existing_monitoring_containers.results }}"
  when:
    - item.rc == 0
    - "'\"com.docker.compose.project\":\"monitoring\"' not in item.stdout"
  register: legacy_monitoring_removed
  changed_when: true

- name: Start monitoring stack with Docker Compose
  command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ monitoring_stack_dir }}/{{ monitoring_compose_file }}"
      - up
      - "-d"
      - "--remove-orphans"
    chdir: "{{ monitoring_stack_dir }}"
  register: monitoring_compose_up
  changed_when: >
    'Created' in monitoring_compose_up.stdout or
    'Created' in monitoring_compose_up.stderr or
    'Started' in monitoring_compose_up.stdout or
    'Started' in monitoring_compose_up.stderr or
    'Recreated' in monitoring_compose_up.stdout or
    'Recreated' in monitoring_compose_up.stderr or
    'Pulling' in monitoring_compose_up.stdout or
    'Pulling' in monitoring_compose_up.stderr

- name: Restart monitoring stack when configuration changes
  command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ monitoring_stack_dir }}/{{ monitoring_compose_file }}"
      - restart
    chdir: "{{ monitoring_stack_dir }}"
  when: >
    monitoring_stack_files.changed or
    monitoring_env_file_result.changed or
    (
      monitoring_alertmanager_config is defined and
      monitoring_alertmanager_config.changed | default(false)
    )
  changed_when: true

- name: Check monitoring stack containers
  command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ monitoring_stack_dir }}/{{ monitoring_compose_file }}"
      - ps
    chdir: "{{ monitoring_stack_dir }}"
  register: monitoring_stack_ps
  changed_when: false
