---
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow Nginx Proxy Manager admin UI
  ufw:
    rule: allow
    port: "81"
    proto: tcp

- name: Allow Jenkins web UI
  ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Allow Jenkins agent connections
  ufw:
    rule: allow
    port: "50000"
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny
