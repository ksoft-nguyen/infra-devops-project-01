---
- name: Create CI/CD stack directory
  file:
    path: "{{ ci_cd_stack_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copy CI/CD stack files
  copy:
    src: "{{ playbook_dir }}/files/ci-cd/"
    dest: "{{ ci_cd_stack_dir }}/"
    owner: ubuntu
    group: ubuntu
    mode: preserve
    directory_mode: "0755"

- name: Inspect existing CI/CD containers
  command:
    argv:
      - docker
      - inspect
      - "--format"
      - "{{ '{{ json .Config.Labels }}' }}"
      - "{{ item }}"
  loop: "{{ ci_cd_container_names }}"
  register: existing_ci_cd_containers
  changed_when: false
  failed_when: false

- name: Remove legacy CI/CD containers
  command:
    argv:
      - docker
      - rm
      - "--force"
      - "{{ item.item }}"
  loop: "{{ existing_ci_cd_containers.results }}"
  when:
    - item.rc == 0
    - "'\"com.docker.compose.project\":\"ci-cd\"' not in item.stdout"
  register: legacy_ci_cd_removed
  changed_when: true

- name: Start CI/CD stack with Docker Compose
  command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ ci_cd_stack_dir }}/{{ ci_cd_compose_file }}"
      - up
      - "-d"
    chdir: "{{ ci_cd_stack_dir }}"
  register: ci_cd_compose_up
  changed_when: >
    'Created' in ci_cd_compose_up.stdout or
    'Created' in ci_cd_compose_up.stderr or
    'Started' in ci_cd_compose_up.stdout or
    'Started' in ci_cd_compose_up.stderr or
    'Recreated' in ci_cd_compose_up.stdout or
    'Recreated' in ci_cd_compose_up.stderr or
    'Pulling' in ci_cd_compose_up.stdout or
    'Pulling' in ci_cd_compose_up.stderr

- name: Check CI/CD stack containers
  command:
    argv:
      - docker
      - compose
      - "-f"
      - "{{ ci_cd_stack_dir }}/{{ ci_cd_compose_file }}"
      - ps
    chdir: "{{ ci_cd_stack_dir }}"
  register: ci_cd_stack_ps
  changed_when: false
