<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc">
  <title id="title">MERN Todo DevOps Infrastructure Architecture</title>
  <desc id="desc">Layered architecture diagram of a MERN Todo application hosted on one AWS EC2 instance and managed using Terraform, Ansible, Docker Compose, Portainer, GitHub Actions, Jenkins, Nginx Proxy Manager, Prometheus, Grafana, Alertmanager and exporters.</desc>
  <defs>
    <style>
      .background { fill: #fafaf7; }
      .title { font: 700 43px Arial, sans-serif; fill: #16181d; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #5d6470; }
      .label { font: 700 17px Arial, sans-serif; fill: #22262e; }
      .layer { font: 700 22px Arial, sans-serif; fill: #16181d; }
      .node-title { font: 700 16px Arial, sans-serif; fill: #151920; }
      .node-text { font: 400 13px Arial, sans-serif; fill: #424a57; }
      .small { font: 400 12px Arial, sans-serif; fill: #5a6270; }
      .port { font: 700 12px Arial, sans-serif; fill: #26486e; }
      .boundary { fill: #f2f5fb; stroke: #2f3640; stroke-width: 2; rx: 24; }
      .aws { fill: #f7f9fd; stroke: #6e7787; stroke-width: 2.5; stroke-dasharray: 9 7; rx: 22; }
      .section { stroke: #89909b; stroke-width: 2; stroke-dasharray: 8 6; rx: 20; }
      .node { fill: #ffffff; stroke: #303640; stroke-width: 1.8; rx: 14; }
      .node-soft { fill: #fffaf2; stroke: #303640; stroke-width: 1.8; rx: 14; }
      .node-blue { fill: #e6f0ff; stroke: #303640; stroke-width: 1.8; rx: 14; }
      .node-green { fill: #e8f5ec; stroke: #303640; stroke-width: 1.8; rx: 14; }
      .node-orange { fill: #fff0dc; stroke: #303640; stroke-width: 1.8; rx: 14; }
      .node-purple { fill: #efe9ff; stroke: #303640; stroke-width: 1.8; rx: 14; }
      .node-red { fill: #ffecec; stroke: #b55555; stroke-width: 1.6; rx: 12; }
      .chip { fill: #eaf0f8; stroke: #b6c0d0; stroke-width: 1; rx: 10; }
      .chip-manual { fill: #fff2d9; stroke: #d3a242; stroke-width: 1; rx: 10; }
      .arrow { fill: none; stroke: #222833; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #336fb5; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .arrow-orange { fill: none; stroke: #c66b1b; stroke-width: 2.5; marker-end: url(#arrow-orange); }
      .arrow-dash { fill: none; stroke: #626b78; stroke-width: 2.1; stroke-dasharray: 7 5; marker-end: url(#arrow-muted); }
      .icon-circle { fill: #ffffff; stroke: #c2cad7; stroke-width: 1.2; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#222833"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#336fb5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#c66b1b"/>
    </marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#626b78"/>
    </marker>
  </defs>

  <rect class="background" width="1800" height="1160"/>

  <text x="65" y="67" class="title">MERN Todo DevOps Platform on AWS</text>
  <text x="66" y="100" class="subtitle">Terraform provisioning | Ansible configuration | Docker Compose and Portainer runtime | Jenkins deployment | Prometheus and Grafana observability</text>
  <rect x="1421" y="41" width="315" height="48" rx="24" fill="#111827"/>
  <text x="1578" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Single-Host Portfolio Architecture</text>

  <rect x="44" y="130" width="1712" height="974" class="boundary"/>

  <!-- External inputs -->
  <rect x="72" y="167" width="242" height="893" fill="#eef3fd" class="section"/>
  <text x="193" y="201" text-anchor="middle" class="layer">Entry &amp; Control</text>

  <rect x="97" y="235" width="192" height="106" class="node-blue"/>
  <circle cx="128" cy="270" r="17" class="icon-circle"/>
  <path d="M116 273 C116 260 140 260 140 273 M122 260 L122 286 M134 260 L134 286 M116 275 L140 275" fill="none" stroke="#336fb5" stroke-width="2"/>
  <text x="158" y="263" class="node-title">End Users</text>
  <text x="158" y="285" class="node-text">Browser traffic</text>
  <text x="158" y="303" class="port">HTTPS :443</text>

  <rect x="97" y="378" width="192" height="128" class="node-soft"/>
  <circle cx="128" cy="414" r="17" class="icon-circle"/>
  <path d="M117 414 H139 M128 403 V425 M118 406 C134 400 139 425 119 422 M138 406 C122 400 117 425 137 422" fill="none" stroke="#d49428" stroke-width="1.8"/>
  <text x="158" y="407" class="node-title">DNS / TLS</text>
  <text x="158" y="429" class="node-text">Domain routing and</text>
  <text x="158" y="447" class="node-text">proxy-host rules</text>
  <rect x="154" y="463" width="102" height="24" class="chip-manual"/>
  <text x="205" y="480" text-anchor="middle" class="small">manual / external</text>

  <rect x="97" y="558" width="192" height="106" class="node-purple"/>
  <circle cx="128" cy="592" r="17" class="icon-circle"/>
  <path d="M119 586 L128 580 L137 586 L137 598 L128 604 L119 598 Z M128 580 V604 M119 586 L137 598 M137 586 L119 598" fill="none" stroke="#6d4dc2" stroke-width="1.7"/>
  <text x="158" y="587" class="node-title">GitHub</text>
  <text x="158" y="609" class="node-text">Repository</text>
  <text x="158" y="628" class="port">push to main</text>

  <rect x="97" y="708" width="192" height="116" class="node-green"/>
  <circle cx="128" cy="744" r="17" class="icon-circle"/>
  <path d="M119 752 L128 733 L137 752 Z M123 746 H133" fill="none" stroke="#31825a" stroke-width="2"/>
  <text x="158" y="739" class="node-title">Engineer</text>
  <text x="158" y="761" class="node-text">Terraform apply</text>
  <text x="158" y="779" class="node-text">Ansible playbook</text>

  <rect x="97" y="875" width="192" height="118" class="node-red"/>
  <text x="193" y="907" text-anchor="middle" class="node-title">Public Ingress</text>
  <text x="193" y="930" text-anchor="middle" class="node-text">SG + UFW currently open</text>
  <text x="193" y="951" text-anchor="middle" class="port">22, 80, 81, 443, 3000</text>
  <text x="193" y="969" text-anchor="middle" class="port">3111, 8080, 8111, 9443</text>
  <text x="193" y="987" text-anchor="middle" class="port">9090, 9093, 9100, 9115, 50000</text>

  <!-- AWS host boundary -->
  <rect x="342" y="167" width="1042" height="893" class="aws"/>
  <text x="369" y="201" class="layer">AWS Cloud / Default VPC</text>
  <rect x="1123" y="179" width="230" height="30" class="chip"/>
  <text x="1238" y="199" text-anchor="middle" class="label">EC2 Ubuntu 22.04 Host</text>

  <!-- Provisioning layer -->
  <rect x="369" y="230" width="987" height="151" fill="#eef4ff" class="section"/>
  <text x="389" y="261" class="layer">Provisioning &amp; Host Security</text>

  <rect x="397" y="286" width="168" height="69" class="node-blue"/>
  <text x="481" y="313" text-anchor="middle" class="node-title">Terraform</text>
  <text x="481" y="335" text-anchor="middle" class="node-text">EC2 + Security Group</text>

  <rect x="599" y="286" width="168" height="69" class="node-soft"/>
  <text x="683" y="313" text-anchor="middle" class="node-title">Bootstrap</text>
  <text x="683" y="335" text-anchor="middle" class="node-text">Docker + 2 GB swap</text>

  <rect x="801" y="286" width="175" height="69" class="node-green"/>
  <text x="888" y="313" text-anchor="middle" class="node-title">Ansible</text>
  <text x="888" y="335" text-anchor="middle" class="node-text">Stack deployment</text>

  <rect x="1008" y="276" width="316" height="89" class="node"/>
  <text x="1166" y="301" text-anchor="middle" class="node-title">Host Controls</text>
  <text x="1166" y="323" text-anchor="middle" class="node-text">UFW default deny | Fail2Ban</text>
  <text x="1166" y="343" text-anchor="middle" class="node-text">SSH key-only | root login disabled</text>

  <path d="M565 320 H599" class="arrow-blue"/>
  <path d="M767 320 H801" class="arrow-blue"/>
  <path d="M976 320 H1008" class="arrow-blue"/>

  <!-- Delivery and app layer -->
  <rect x="369" y="408" width="987" height="286" fill="#f7f4ed" class="section"/>
  <text x="389" y="439" class="layer">Delivery, Edge &amp; Application Layer</text>

  <rect x="397" y="474" width="164" height="84" class="node-purple"/>
  <text x="479" y="502" text-anchor="middle" class="node-title">GitHub Actions</text>
  <text x="479" y="524" text-anchor="middle" class="node-text">Trigger Jenkins job</text>
  <text x="479" y="544" text-anchor="middle" class="port">Secrets auth</text>

  <rect x="595" y="474" width="164" height="84" class="node-orange"/>
  <text x="677" y="502" text-anchor="middle" class="node-title">Jenkins</text>
  <text x="677" y="524" text-anchor="middle" class="node-text">deploy.sh + make prod</text>
  <text x="677" y="544" text-anchor="middle" class="port">:8080 / :50000</text>

  <rect x="793" y="474" width="187" height="84" class="node-soft"/>
  <text x="886" y="502" text-anchor="middle" class="node-title">Nginx Proxy Manager</text>
  <text x="886" y="524" text-anchor="middle" class="node-text">Reverse proxy and TLS</text>
  <text x="886" y="544" text-anchor="middle" class="port">:80 / :81 / :443</text>

  <rect x="1013" y="474" width="141" height="84" class="node-blue"/>
  <text x="1083" y="502" text-anchor="middle" class="node-title">React UI</text>
  <text x="1083" y="524" text-anchor="middle" class="node-text">Frontend</text>
  <text x="1083" y="544" text-anchor="middle" class="port">:3111 -> :3000</text>

  <rect x="1182" y="474" width="141" height="84" class="node-green"/>
  <text x="1252" y="502" text-anchor="middle" class="node-title">Express API</text>
  <text x="1252" y="524" text-anchor="middle" class="node-text">JWT + REST</text>
  <text x="1252" y="544" text-anchor="middle" class="port">:8111</text>

  <rect x="1013" y="588" width="310" height="70" class="node"/>
  <text x="1168" y="615" text-anchor="middle" class="node-title">MongoDB 7</text>
  <text x="1168" y="638" text-anchor="middle" class="node-text">Persistent Docker volume | app network</text>

  <rect x="397" y="588" width="164" height="70" class="node-blue"/>
  <text x="479" y="615" text-anchor="middle" class="node-title">Portainer CE</text>
  <text x="479" y="638" text-anchor="middle" class="port">HTTPS :9443</text>

  <rect x="595" y="588" width="385" height="70" class="chip"/>
  <text x="787" y="615" text-anchor="middle" class="node-title">Docker Compose Runtime</text>
  <text x="787" y="638" text-anchor="middle" class="node-text">Five stacks managed on one host</text>

  <path d="M561 516 H595" class="arrow-orange"/>
  <path d="M759 516 H793" class="arrow-orange"/>
  <path d="M980 516 H1013" class="arrow"/>
  <path d="M1154 516 H1182" class="arrow"/>
  <path d="M1252 558 V588" class="arrow"/>
  <path d="M561 623 H595" class="arrow-blue"/>

  <!-- Monitoring layer -->
  <rect x="369" y="720" width="987" height="303" fill="#edf7f0" class="section"/>
  <text x="389" y="751" class="layer">Observability &amp; Alerting Layer</text>

  <rect x="397" y="788" width="166" height="78" class="node-green"/>
  <text x="480" y="815" text-anchor="middle" class="node-title">Node Exporter</text>
  <text x="480" y="837" text-anchor="middle" class="node-text">EC2 host metrics</text>
  <text x="480" y="855" text-anchor="middle" class="port">:9100</text>

  <rect x="397" y="901" width="166" height="78" class="node-green"/>
  <text x="480" y="928" text-anchor="middle" class="node-title">Blackbox Exporter</text>
  <text x="480" y="950" text-anchor="middle" class="node-text">Frontend HTTP probe</text>
  <text x="480" y="968" text-anchor="middle" class="port">:9115</text>

  <rect x="597" y="845" width="166" height="78" class="node-green"/>
  <text x="680" y="872" text-anchor="middle" class="node-title">Mongo Exporter</text>
  <text x="680" y="894" text-anchor="middle" class="node-text">DB health/metrics</text>
  <text x="680" y="912" text-anchor="middle" class="port">:9216 internal</text>

  <rect x="806" y="845" width="172" height="78" class="node-orange"/>
  <text x="892" y="872" text-anchor="middle" class="node-title">Prometheus</text>
  <text x="892" y="894" text-anchor="middle" class="node-text">Scrapes + rules</text>
  <text x="892" y="912" text-anchor="middle" class="port">:9090</text>

  <rect x="1020" y="788" width="154" height="78" class="node-soft"/>
  <text x="1097" y="815" text-anchor="middle" class="node-title">Grafana</text>
  <text x="1097" y="837" text-anchor="middle" class="node-text">Dashboard</text>
  <text x="1097" y="855" text-anchor="middle" class="port">:3000</text>

  <rect x="1020" y="901" width="154" height="78" class="node-purple"/>
  <text x="1097" y="928" text-anchor="middle" class="node-title">Alertmanager</text>
  <text x="1097" y="950" text-anchor="middle" class="node-text">Email routing</text>
  <text x="1097" y="968" text-anchor="middle" class="port">:9093</text>

  <rect x="1206" y="845" width="117" height="78" class="node-blue"/>
  <text x="1264" y="872" text-anchor="middle" class="node-title">Alerts</text>
  <text x="1264" y="894" text-anchor="middle" class="node-text">Optional</text>
  <text x="1264" y="912" text-anchor="middle" class="node-text">SMTP email</text>

  <path d="M563 827 H782 V866 H806" class="arrow-blue"/>
  <path d="M563 940 H782 V902 H806" class="arrow-blue"/>
  <path d="M763 884 H806" class="arrow-blue"/>
  <path d="M978 872 H1020 V827" class="arrow-blue"/>
  <path d="M978 902 H1020 V940" class="arrow-blue"/>
  <path d="M1174 940 H1206" class="arrow-blue"/>

  <!-- Operations / audiences -->
  <rect x="1413" y="167" width="313" height="893" fill="#f4f3f8" class="section"/>
  <text x="1569" y="201" text-anchor="middle" class="layer">Access &amp; Outcomes</text>

  <rect x="1444" y="264" width="252" height="122" class="node-soft"/>
  <text x="1570" y="296" text-anchor="middle" class="node-title">Public Application</text>
  <text x="1570" y="321" text-anchor="middle" class="node-text">Frontend through proxy</text>
  <text x="1570" y="343" text-anchor="middle" class="node-text">API through proxy host</text>
  <rect x="1495" y="353" width="150" height="22" class="chip-manual"/>
  <text x="1570" y="369" text-anchor="middle" class="small">routing managed in NPM UI</text>

  <rect x="1444" y="464" width="252" height="126" class="node-purple"/>
  <text x="1570" y="496" text-anchor="middle" class="node-title">Platform Operator</text>
  <text x="1570" y="521" text-anchor="middle" class="node-text">Jenkins builds + deployments</text>
  <text x="1570" y="543" text-anchor="middle" class="node-text">Portainer container management</text>
  <text x="1570" y="567" text-anchor="middle" class="port">:8080 / HTTPS :9443</text>

  <rect x="1444" y="668" width="252" height="148" class="node-green"/>
  <text x="1570" y="702" text-anchor="middle" class="node-title">Platform Monitoring</text>
  <text x="1570" y="729" text-anchor="middle" class="node-text">Grafana dashboards</text>
  <text x="1570" y="751" text-anchor="middle" class="node-text">Prometheus alerts</text>
  <text x="1570" y="773" text-anchor="middle" class="node-text">Alertmanager email</text>
  <text x="1570" y="797" text-anchor="middle" class="port">Host + MongoDB + HTTP</text>

  <rect x="1444" y="878" width="252" height="114" class="node-red"/>
  <text x="1570" y="909" text-anchor="middle" class="node-title">Production Roadmap</text>
  <text x="1570" y="934" text-anchor="middle" class="node-text">Restrict admin ports</text>
  <text x="1570" y="954" text-anchor="middle" class="node-text">Secret manager + remote state</text>
  <text x="1570" y="974" text-anchor="middle" class="node-text">CI gates + immutable releases</text>

  <!-- Cross-boundary flows -->
  <path d="M289 287 H331 V459 H862 V474" class="arrow"/>
  <path d="M289 440 H345 V450 H910 V474" class="arrow-dash"/>
  <path d="M289 611 H343 V516 H397" class="arrow-orange"/>
  <path d="M289 766 H330 V320 H397" class="arrow-blue"/>
  <path d="M1323 516 H1384 V325 H1444" class="arrow"/>
  <path d="M677 474 V458 H1392 V527 H1444" class="arrow-dash"/>
  <path d="M1174 827 H1400 V742 H1444" class="arrow-blue"/>
  <path d="M1323 884 H1400 V773 H1444" class="arrow-blue"/>

  <!-- Runtime-to-monitoring internal connections -->
  <path d="M1083 558 V574 H990 V701 H480 V901" class="arrow-dash"/>
  <path d="M1168 658 V704 H680 V845" class="arrow-dash"/>

  <!-- Legend -->
  <rect x="72" y="1073" width="1654" height="20" fill="none"/>
  <rect x="74" y="1071" width="16" height="16" class="node-blue"/>
  <text x="99" y="1084" class="small">Provisioning / ingress</text>
  <rect x="252" y="1071" width="16" height="16" class="node-orange"/>
  <text x="277" y="1084" class="small">CI/CD or metrics engine</text>
  <rect x="485" y="1071" width="16" height="16" class="node-green"/>
  <text x="510" y="1084" class="small">Observed service</text>
  <rect x="665" y="1071" width="16" height="16" class="node-purple"/>
  <text x="690" y="1084" class="small">Automation / notification</text>
  <rect x="897" y="1071" width="16" height="16" class="chip-manual"/>
  <text x="922" y="1084" class="small">Manual or external dependency</text>
  <path d="M1178 1079 H1223" class="arrow-blue"/>
  <text x="1235" y="1084" class="small">Managed flow</text>
  <path d="M1358 1079 H1403" class="arrow-dash"/>
  <text x="1415" y="1084" class="small">Probe / external configuration</text>
</svg>
